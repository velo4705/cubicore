<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="Cubicore">
  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Black focus corners, set apart from the square -->
  <g fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 48H48v80"/>
    <path d="M384 48h80v80"/>
    <path d="M464 384v80h-80"/>
    <path d="M48 384v80h80"/>
  </g>

  <!-- Bottom layer: one big light blue square -->
  <rect x="86" y="86" width="340" height="340" fill="#9bd8f7"/>

  <!-- Next layer: four plain blue half-squares -->
  <g fill="#2e86d6">
    <rect x="120" y="120" width="124" height="124"/>
    <rect x="268" y="120" width="124" height="124"/>
    <rect x="120" y="268" width="124" height="124"/>
    <rect x="268" y="268" width="124" height="124"/>
  </g>
</svg>
